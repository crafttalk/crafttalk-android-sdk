name: Android CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run JVM tests and Android Lint
        run: ./gradlew --continue :chat:jacocoDebugUnitTestReport :app:testDebugUnitTest :chat:lintDebug :app:lintDebug
      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            */build/test-results/testDebugUnitTest/TEST-*.xml
            */build/reports/tests/testDebugUnitTest/
            */build/reports/lint-results-debug.*
            chat/build/reports/jacoco/jacocoDebugUnitTestReport/
          retention-days: 14

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Assemble SDK, demo and instrumentation APKs
        run: ./gradlew :chat:assembleRelease :app:assembleDebug :chat:assembleDebugAndroidTest :app:assembleDebugAndroidTest
